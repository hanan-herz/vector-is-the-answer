<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="600" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">One frozen computation, two readouts</text>

  <!-- ============ PANEL A : autoregressive token loop ============ -->
  <rect x="20" y="48" width="1160" height="290" rx="14" fill="#fff8f2" stroke="#f0dcc4" stroke-width="1.5"/>
  <text x="40" y="84" font-size="16" font-weight="700" fill="#9a3412">A — Usual regime: autoregressive token loop</text>

  <!-- A boxes -->
  <g filter="url(#soft)">
    <rect x="45" y="112" width="150" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="245" y="112" width="200" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="495" y="112" width="160" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="705" y="112" width="110" height="64" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <rect x="990" y="112" width="170" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <text x="120" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Prompt tokens</text>
  <text x="120" y="160" text-anchor="middle" font-size="11.5" fill="#64748b">x&#8321;&#8230;x&#8345;</text>

  <text x="345" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Transformer (frozen)</text>
  <text x="345" y="160" text-anchor="middle" font-size="11.5" fill="#16a34a" font-family="ui-monospace, Menlo, monospace">h_T &#8712; R^d @ final token</text>

  <text x="575" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">LM head</text>
  <text x="575" y="160" text-anchor="middle" font-size="11.5" fill="#64748b">softmax over vocab</text>

  <text x="760" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">token t&#7522;</text>
  <text x="760" y="160" text-anchor="middle" font-size="11.5" fill="#b91c1c">(discrete)</text>

  <text x="1075" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">answer tokens</text>
  <text x="1075" y="160" text-anchor="middle" font-size="11.5" fill="#64748b">t&#8321;&#8230;t&#8342;</text>

  <!-- A forward arrows -->
  <line x1="195" y1="144" x2="241" y2="144" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="445" y1="144" x2="491" y2="144" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="655" y1="144" x2="701" y2="144" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="815" y1="144" x2="986" y2="144" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="900" y="130" text-anchor="middle" font-size="11" fill="#64748b">after N iterations</text>

  <!-- A feedback loop -->
  <path d="M 760 176 L 760 238 L 370 238 L 370 180" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="565" y="258" text-anchor="middle" font-size="12" fill="#b91c1c">feed token id back &#8594; re-embed &#8594; repeat — each lap is another full forward pass</text>

  <!-- A bottleneck annotation -->
  <path d="M 768 178 L 842 198" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.7"/>
  <text x="850" y="205" font-size="12" font-weight="600" fill="#b91c1c">discrete bottleneck: argmax / sample</text>
  <text x="850" y="222" font-size="12" fill="#b91c1c">collapses h to 1 of ~151k token ids</text>

  <text x="600" y="308" text-anchor="middle" font-size="12.5" font-style="italic" fill="#9a3412">k answer tokens &#8658; k serial passes; the latent is squeezed through the vocabulary on every step</text>

  <!-- divider callout -->
  <text x="600" y="353" text-anchor="middle" font-size="12.5" font-style="italic" fill="#475569">the difference is what crosses the boundary — a token id vs. the full vector</text>

  <!-- ============ PANEL B : latent-first readout ============ -->
  <rect x="20" y="362" width="1160" height="290" rx="14" fill="#f2faf5" stroke="#cde9d8" stroke-width="1.5"/>
  <text x="40" y="398" font-size="16" font-weight="700" fill="#166534">B — Latent-first: single forward pass + small readout head</text>

  <g filter="url(#soft)">
    <rect x="45" y="426" width="150" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="245" y="426" width="200" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="495" y="426" width="210" height="64" rx="10" fill="#e8f7ee" stroke="#22c55e" stroke-width="2"/>
    <rect x="755" y="426" width="210" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="995" y="426" width="165" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <text x="120" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Prompt tokens</text>
  <text x="120" y="474" text-anchor="middle" font-size="11.5" fill="#64748b">x&#8321;&#8230;x&#8345;</text>

  <text x="345" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Transformer (frozen)</text>
  <text x="345" y="474" text-anchor="middle" font-size="11.5" fill="#64748b">one pass only</text>

  <text x="600" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">final-token residual</text>
  <text x="600" y="474" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="ui-monospace, Menlo, monospace">h_T &#8712; R^d — nothing discarded</text>

  <text x="860" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">small readout head</text>
  <text x="860" y="474" text-anchor="middle" font-size="11.5" fill="#64748b">linear / 1-layer MLP</text>

  <text x="1077" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">closed-set decision</text>
  <text x="1077" y="474" text-anchor="middle" font-size="11" fill="#64748b">one or many parallel fields</text>

  <!-- B arrows -->
  <line x1="195" y1="458" x2="241" y2="458" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="445" y1="458" x2="491" y2="458" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="705" y1="458" x2="751" y2="458" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="965" y1="458" x2="991" y2="458" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- B badges -->
  <rect x="500" y="512" width="200" height="24" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="600" y="529" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">no sampling &#183; no loop</text>

  <!-- B boundary: where latent-first stops -->
  <line x1="1077" y1="490" x2="1077" y2="534" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/>
  <rect x="820" y="540" width="340" height="64" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="836" y="562" font-size="12" font-weight="700" fill="#6d28d9">open-ended / sequential output &#8594; iterate:</text>
  <text x="836" y="579" font-size="11" fill="#6d28d9">feed back the token (panel A) — or feed h itself back:</text>
  <text x="836" y="595" font-size="11" fill="#6d28d9">keeps the information, risks drifting off-manifold</text>

  <text x="600" y="614" text-anchor="middle" font-size="12.5" font-style="italic" fill="#166534">0 tokens generated &#183; 1 pass total &#183; the readout sees everything the forward pass computed</text>
</svg>
